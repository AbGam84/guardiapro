<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GuardiaPro — acceso</title>
  <link rel="stylesheet" href="/static/css/app.css?v=2" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>
  <div class="login-wrap panel">
    <h1>GuardiaPro</h1>
    <p class="muted">Bitácora digital para empresas de seguridad · Costa Rica</p>
    <form id="loginForm" class="form-grid">
      <label>Código empresa (opcional)<input name="company_code" placeholder="demo-seguridad" autocomplete="organization" /></label>
      <label>Usuario<input name="username" required autocomplete="username" /></label>
      <label>Clave<input name="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
    <p id="err" class="error hidden"></p>
    <p class="muted" style="margin-top:16px;font-size:.78rem" id="demoHints">
      Demo admin: <code>admin</code> / <code>Admin2026!</code><br>
      Demo oficial: <code>juan</code> / <code>Guardia2026!</code><br>
      Vendor: <a href="/vendor">/vendor</a>
    </p>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.classList.add("hidden");
      const fd = new FormData(e.target);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: fd.get("username"),
            password: fd.get("password"),
            company_code: fd.get("company_code") || "",
          }),
        });
        setToken(data.access_token);
        const role = data.user.role;
        location.href = role === "guard" ? "/guardia" : "/admin";
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove("hidden");
      }
    });
    if (getToken()) {
      api("/api/auth/me").then((d) => {
        location.href = d.user.role === "guard" ? "/guardia" : "/admin";
      }).catch(() => setToken(""));
    }
  </script>
</body>
</html>
