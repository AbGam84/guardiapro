<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Excalibu Sentinel — cámara</title>
  <link rel="icon" href="/static/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/static/css/app.css?v=3" />
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div><h1 id="camTitle">Cámara</h1><p class="muted" id="camMeta">—</p></div>
      <a class="btn btn-ghost" href="/guardia">Volver</a>
    </div>
    <div class="panel" id="viewer">
      <p class="muted">Cargando…</p>
    </div>
    <div class="panel" style="margin-top:12px" id="actions"></div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    const id = location.pathname.split("/").pop();
    async function load() {
      const d = await api(`/api/cameras/${id}`);
      const c = d.camera;
      document.getElementById("camTitle").textContent = c.name;
      document.getElementById("camMeta").textContent = `${c.camera_type_label} · ${c.brand_label} · ${c.location || c.ip_address || ""}`;
      let html = "";
      if (c.stream_url) {
        html += `<img src="${c.stream_url}" alt="${c.name}" style="width:100%;max-height:420px;object-fit:contain;background:#000;border-radius:8px" onerror="this.replaceWith(Object.assign(document.createElement('p'),{className:'muted',textContent:'Vista en vivo no disponible en navegador. Use enlace web o app del fabricante.'}))"/>`;
      } else {
        html += `<p class="muted">Sin URL de video en navegador. Abra el panel web o la app del fabricante (RTSP requiere VLC en PC).</p>`;
      }
      document.getElementById("viewer").innerHTML = html;
      let btns = "";
      if (c.web_url) btns += `<a class="btn btn-primary btn-block" href="${c.web_url}" target="_blank" rel="noopener">Abrir panel web</a>`;
      btns += `<button class="btn btn-ghost btn-block" type="button" id="logView">Registrar revisión en bitácora</button>`;
      document.getElementById("actions").innerHTML = btns;
      document.getElementById("logView").onclick = async () => {
        const active = await api("/api/shifts/active");
        if (!active.shift) { alert("Inicie turno primero"); return; }
        await api(`/api/shifts/${active.shift.id}/log`, {
          method: "POST",
          body: JSON.stringify({ entry_type: "novedad", note: `Revisión cámara: ${c.name} (${c.location || c.camera_type_label})`, severity: "normal" }),
        });
        alert("Registrado en bitácora");
      };
    }
    load().catch(() => { location.href = "/login"; });
  </script>
</body>
</html>
