<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Excalibu Sentinel">
  <defs>
    <linearGradient id="blade" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#67e8d9"/>
      <stop offset="55%" stop-color="#12c4a0"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#0a0f18"/>
  <!-- Perímetro / cobertura de ronda -->
  <circle cx="256" cy="256" r="198" fill="none" stroke="#12c4a0" stroke-width="3" opacity=".22"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#12c4a0" stroke-width="2" opacity=".14" stroke-dasharray="10 14"/>
  <!-- Escudo principal -->
  <path d="M256 64 L392 148 L372 320 Q256 448 140 320 L120 148 Z" fill="url(#shieldFill)" stroke="url(#gold)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 92 L352 158 L338 300 Q256 400 174 300 L160 158 Z" fill="none" stroke="#243044" stroke-width="4"/>
  <!-- Espada Excalibur -->
  <path d="M256 88 L278 196 L256 432 L234 196 Z" fill="url(#blade)"/>
  <path d="M256 88 L262 168 L256 182 L250 168 Z" fill="#f8fafc" opacity=".92"/>
  <rect x="222" y="196" width="68" height="38" rx="10" fill="url(#gold)"/>
  <rect x="206" y="234" width="100" height="22" rx="8" fill="url(#gold)"/>
  <circle cx="256" cy="254" r="14" fill="#0a0f18" stroke="#ffb020" stroke-width="5"/>
  <!-- Candado = control y acceso seguro -->
  <rect x="228" y="312" width="56" height="44" rx="10" fill="#0a0f18" stroke="#12c4a0" stroke-width="5"/>
  <path d="M244 312 V292 a12 12 0 0 1 24 0 v20" fill="none" stroke="#12c4a0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="334" r="6" fill="#ffb020"/>
  <!-- Check = sitio protegido -->
  <path d="M188 360 L214 386 L248 338" fill="none" stroke="#3dd68c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
