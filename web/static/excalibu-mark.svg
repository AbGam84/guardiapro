<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Excalibu Sentinel — seguridad y rondas">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121a28"/>
      <stop offset="100%" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
    <linearGradient id="teal" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f1724"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <!-- Fondo app -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Ronda GPS (perímetro del sitio) -->
  <circle cx="256" cy="268" r="196" fill="none" stroke="#12c4a0" stroke-width="3" opacity=".18"/>
  <circle cx="256" cy="268" r="168" fill="none" stroke="#12c4a0" stroke-width="2" opacity=".12" stroke-dasharray="8 12"/>
  <path d="M108 320 Q180 210 256 198 Q332 210 404 320" fill="none" stroke="#3eb5e0" stroke-width="4" opacity=".35" stroke-linecap="round"/>
  <circle cx="108" cy="320" r="10" fill="#12c4a0" opacity=".85"/>
  <circle cx="256" cy="198" r="10" fill="#ffb020" opacity=".95"/>
  <circle cx="404" cy="320" r="10" fill="#12c4a0" opacity=".85"/>

  <!-- Escudo de seguridad -->
  <g filter="url(#glow)">
    <path d="M256 56 L404 148 L384 332 Q256 468 128 332 L108 148 Z"
          fill="url(#shieldInner)" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M256 88 L360 158 L344 310 Q256 420 168 310 L152 158 Z"
          fill="none" stroke="#243044" stroke-width="5"/>
  </g>

  <!-- Silueta guardia de seguridad -->
  <g transform="translate(256 248)">
    <!-- hombros y torso -->
    <path d="M-78 52 Q-78 8 -44 -6 L44 -6 Q78 8 78 52 L62 118 L-62 118 Z" fill="url(#teal)"/>
    <!-- cuello -->
    <rect x="-14" y="-28" width="28" height="24" rx="6" fill="#c4a882"/>
    <!-- cabeza -->
    <ellipse cx="0" cy="-52" rx="30" ry="32" fill="#d4b896"/>
    <!-- gorra / gorro de guardia -->
    <path d="M-38 -62 L38 -62 L34 -88 L-34 -88 Z" fill="#1e293b"/>
    <ellipse cx="0" cy="-62" rx="42" ry="10" fill="#334155"/>
    <rect x="-36" y="-66" width="72" height="8" rx="3" fill="#ffb020" opacity=".9"/>
    <!-- placa -->
    <rect x="-22" y="18" width="44" height="34" rx="6" fill="url(#gold)"/>
    <text x="0" y="42" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#0a0f18">EX</text>
    <!-- linterna -->
    <rect x="48" y="36" width="16" height="44" rx="4" fill="#64748b"/>
    <rect x="44" y="28" width="24" height="14" rx="4" fill="#ffb020"/>
    <path d="M68 38 L92 28 L92 52 L68 52 Z" fill="#fef08a" opacity=".75"/>
  </g>

  <!-- Check = sitio verificado -->
  <circle cx="392" cy="392" r="44" fill="#0a0f18" stroke="#12c4a0" stroke-width="5"/>
  <path d="M372 392 L386 406 L416 376" fill="none" stroke="#3dd68c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- QR sutil = ronda escaneada -->
  <g transform="translate(88 392)" opacity=".9">
    <rect width="56" height="56" rx="8" fill="#0a0f18" stroke="#3eb5e0" stroke-width="3"/>
    <rect x="8" y="8" width="14" height="14" rx="2" fill="#12c4a0"/>
    <rect x="34" y="8" width="14" height="14" rx="2" fill="#12c4a0"/>
    <rect x="8" y="34" width="14" height="14" rx="2" fill="#12c4a0"/>
    <rect x="28" y="28" width="8" height="8" fill="#ffb020"/>
    <rect x="40" y="40" width="8" height="8" fill="#ffb020"/>
  </g>
</svg>
