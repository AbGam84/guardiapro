<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-label="Excalibu Sentinel">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12c4a0"/>
      <stop offset="100%" stop-color="#3eb5e0"/>
    </linearGradient>
  </defs>

  <!-- Mark embebido (escala reducida) -->
  <g transform="translate(8 8) scale(0.58)">
    <rect width="512" height="512" rx="108" fill="#0a0f18"/>
    <circle cx="256" cy="268" r="168" fill="none" stroke="#12c4a0" stroke-width="2" opacity=".15" stroke-dasharray="8 12"/>
    <path d="M256 56 L404 148 L384 332 Q256 468 128 332 L108 148 Z" fill="#121a28" stroke="url(#gold)" stroke-width="16" stroke-linejoin="round"/>
    <g transform="translate(256 248)">
      <path d="M-78 52 Q-78 8 -44 -6 L44 -6 Q78 8 78 52 L62 118 L-62 118 Z" fill="#12c4a0"/>
      <ellipse cx="0" cy="-52" rx="30" ry="32" fill="#d4b896"/>
      <path d="M-38 -62 L38 -62 L34 -88 L-34 -88 Z" fill="#1e293b"/>
      <ellipse cx="0" cy="-62" rx="42" ry="10" fill="#334155"/>
      <rect x="-22" y="18" width="44" height="34" rx="6" fill="url(#gold)"/>
    </g>
    <circle cx="392" cy="392" r="36" fill="#0a0f18" stroke="#12c4a0" stroke-width="4"/>
    <path d="M376 392 L388 404 L412 378" fill="none" stroke="#3dd68c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto marca -->
  <text x="320" y="132" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#eef4ff" letter-spacing="-1">Excalibu</text>
  <text x="322" y="182" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="url(#teal)" letter-spacing="8">SENTINEL</text>
  <text x="322" y="228" font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#8fa3bf" letter-spacing=".5">Bitácora · Rondas QR · GPS · Cámaras</text>
  <rect x="322" y="248" width="280" height="4" rx="2" fill="url(#gold)" opacity=".85"/>
</svg>
