services:
  - type: web
    name: excalibu-sentinel
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: GUARDIA_DATA_DIR
        value: /tmp/excalibu-data
      - key: GUARDIA_SECRET_KEY
        generateValue: true
      - key: GUARDIA_ADMIN_USER
        value: admin
      - key: GUARDIA_ADMIN_PASSWORD
        value: Admin2026!
      - key: GUARDIA_VENDOR_USER
        value: vendor
      - key: GUARDIA_VENDOR_PASSWORD
        value: GuardiaVendor2026!
      - key: GUARDIA_SUPPORT
        value: "+50663706546"
      - key: GUARDIA_SUPPORT_DISPLAY
        value: "+506 6370-6546"
